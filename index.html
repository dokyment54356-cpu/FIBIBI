<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Калькулятор баллов для премий</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0f14;
      --surface: #141a22;
      --surface2: #1c2430;
      --ink: #eef2f7;
      --ink-soft: #9aa5b5;
      --ink-muted: #6b7789;
      --line: #2a3444;
      --teal: #14b8a6;
      --teal-dark: #2dd4bf;
      --teal-soft: rgba(20,184,166,0.15);
      --teal-glow: rgba(20,184,166,0.25);
      --red: #fb7185;
      --red-soft: rgba(251,113,133,0.15);
      --amber: #fbbf24;
      --amber-soft: rgba(251,191,36,0.15);
      --green: #34d399;
      --green-soft: rgba(52,211,153,0.15);
      --blue: #60a5fa;
      --blue-soft: rgba(96,165,250,0.15);
      --shadow: 0 4px 24px rgba(0,0,0,0.35);
      --radius: 18px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 90% 60% at 0% 0%, rgba(20,184,166,0.1), transparent 50%),
        radial-gradient(ellipse 70% 50% at 100% 100%, rgba(96,165,250,0.07), transparent 45%);
    }

    .app { display: flex; min-height: 100vh; }

    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1.5px solid var(--line);
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      z-index: 100;
      transition: transform 0.28s ease;
    }

    .sidebar-header {
      padding: 22px 18px 16px;
      border-bottom: 1.5px solid var(--line);
    }

    .sidebar-header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0d9488, #1d4ed8);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      font-size: 15px;
      box-shadow: 0 4px 12px var(--teal-glow);
    }

    .sidebar-header p {
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 6px;
      padding-left: 44px;
    }

    .nav { flex: 1; overflow-y: auto; padding: 12px 10px; }

    .nav-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
      padding: 8px 12px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-soft);
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      margin-bottom: 2px;
      transition: all 0.15s;
    }
    .nav-item:hover { background: var(--surface2); color: var(--ink); }
    .nav-item.active {
      background: var(--teal-soft);
      color: var(--teal-dark);
    }

    .nav-item .badge {
      margin-left: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
      min-width: 30px;
      text-align: center;
      background: var(--surface2);
      color: var(--ink-muted);
    }
    .nav-item.active .badge,
    .nav-item .badge.on {
      background: var(--teal);
      color: #fff;
    }

    .sidebar-footer {
      padding: 12px 14px 16px;
      border-top: 1.5px solid var(--line);
    }

    .save-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
      padding: 9px 12px;
      background: var(--surface2);
      border-radius: 10px;
    }
    .save-pill.on { color: var(--green); background: var(--green-soft); }
    .save-pill .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .main {
      flex: 1;
      margin-left: 260px;
      padding: 28px 32px 80px;
      max-width: 880px;
    }

    .page-header { margin-bottom: 20px; }
    .page-header h2 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .page-header p {
      color: var(--ink-soft);
      font-size: 14px;
      margin-top: 4px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: none;
    }
    .btn-primary {
      background: var(--teal);
      color: #fff;
      box-shadow: 0 4px 12px var(--teal-glow);
    }
    .btn-primary:hover { background: var(--teal-dark); }
    .btn-danger {
      background: var(--red-soft);
      color: var(--red);
      border: 1.5px solid rgba(251,113,133,0.35);
    }
    .btn-danger:hover { background: rgba(251,113,133,0.25); }
    .btn-ghost {
      background: var(--surface2);
      color: var(--ink-soft);
      border: 1.5px solid var(--line);
    }
    .btn-ghost:hover { border-color: #3d4a5c; color: var(--ink); }

    .card {
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .card-head {
      padding: 12px 18px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-head.obschee { background: var(--red-soft); color: var(--red); }
    .card-head.dept { background: var(--blue-soft); color: var(--blue); }
    .card-head.inoe { background: var(--amber-soft); color: var(--amber); }

    .cols {
      display: grid;
      grid-template-columns: 1fr 70px 120px 70px;
      gap: 10px;
      padding: 8px 18px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-muted);
      background: var(--surface2);
      border-bottom: 1px solid var(--line);
    }
    .cols > div:nth-child(2),
    .cols > div:nth-child(3),
    .cols > div:nth-child(4) { text-align: center; }

    .row {
      display: grid;
      grid-template-columns: 1fr 70px 120px 70px;
      align-items: center;
      gap: 10px;
      padding: 11px 18px;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: none; }
    .row:hover { background: rgba(20,184,166,0.06); }

    .row-name { font-size: 13.5px; font-weight: 600; }

    .pts {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--teal-dark);
      background: var(--teal-soft);
      padding: 5px 0;
      border-radius: 8px;
      text-align: center;
    }

    .qty-wrap {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    .qty-wrap:focus-within {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-glow);
      background: var(--surface2);
    }
    .qty-btn {
      width: 32px; height: 34px;
      border: none;
      background: transparent;
      color: var(--ink-soft);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .qty-btn:hover { color: var(--teal); background: var(--teal-soft); }

    .qty-input {
      width: 40px;
      border: none;
      background: transparent;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      outline: none;
      -moz-appearance: textfield;
    }
    .qty-input::-webkit-outer-spin-button,
    .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; }

    .sum {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      color: var(--ink-muted);
    }
    .sum.on { color: var(--teal-dark); }

    .total-bar {
      position: sticky;
      bottom: 0;
      padding: 16px 0 8px;
      background: linear-gradient(180deg, transparent, var(--bg) 25%);
    }
    .total-card {
      background: linear-gradient(135deg, #0f766e, #0d9488 50%, #14b8a6);
      border: 1px solid rgba(45,212,191,0.35);
      border-radius: var(--radius);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 32px rgba(13,148,136,0.3);
    }
    .total-label { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.75); }
    .total-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      font-weight: 600;
      color: #fff;
    }
    .total-value span {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.55);
      margin-left: 6px;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--surface2);
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      z-index: 999;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
      box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .menu-toggle {
      display: none;
      position: fixed;
      top: 14px; left: 14px;
      z-index: 200;
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      width: 44px; height: 44px;
      align-items: center; justify-content: center;
      cursor: pointer;
    }
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 90;
    }

    @media (max-width: 860px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; padding: 20px 14px 90px; }
      .menu-toggle { display: flex; }
      .overlay.open { display: block; }
      .page-header h2 { padding-left: 48px; font-size: 22px; }
      .row, .cols {
        grid-template-columns: 1fr 60px 110px 60px;
        gap: 8px;
        padding-left: 12px;
        padding-right: 12px;
      }
    }

    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr; gap: 8px; }
      .cols { display: none; }
      .pts, .sum { text-align: left; }
      .qty-wrap { max-width: 140px; }
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  </style>
</head>
<body>
  <button class="menu-toggle" id="menuToggle" aria-label="Меню">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast"></div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1><span class="logo">⚡</span> Баллы премий</h1>
        <p>Калькулятор по отделам</p>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <div class="save-pill" id="saveStatus">
          <span class="dot"></span>
          <span id="saveText">Автосохранение</span>
        </div>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <script>
    const OBSCHEE = [
      ["Участие в спецоперациях (дропы, поставки, рейды, защита ФЗ, тренировки, отбитие острова и т.д.)", 5],
      ["Рейды и WIN Дропы", 10],
      ["Кадровая работа (1 шт)", 2],
      ["Арест (1 шт)", 3],
    ];

    const INOE = [
      ["WIN Рейды на FIB", 20],
      ["WIN Рейды на другие фракции", 10],
      ["Все, что не прописано в таблице и т.д.", 2],
    ];

    const DATA = {
      "ATF": [
        ["Банки/Бизнесы (штурм)", 5],
        ["Похищения", 6],
        ["Проверка отчетов на повышение ATF", 4],
      ],
      "AF": [
        ["Участие в мероприятиях на вертолете", 6],
        ["Осуществление воздушного патруля (30 мин)", 7],
        ["Проверка отчетов на повышение AF", 4],
      ],
      "HRT": [
        ["Патрулирование трассы (30 мин)", 7],
        ["Проведение тренировок (арена)", 4],
        ["Проверка отчетов на повышение HRT", 4],
      ],
      "NSB": [
        ["Отбитие бизнесов/банков", 5],
        ["Проверка отчетов на повышение NSB", 4],
      ],
      "IB": [
        ["Делопроизводства и кейсы (1 шт)", 20],
        ["Надзорная деятельность (за одно задержание)", 5],
        ["Выдача и проверка переаттестации", 2],
        ["Выдача дисциплинарных взысканий", 2],
        ["Проверка отчетов на повышение IB", 4],
      ],
      "MHC": [
        ["Рес на МП (1 шт)", 2],
        ["Выдача вакцин", 7],
        ["Проверка отчетов на повышение MHC", 4],
      ],
      "FA": [
        ["Реагирование на похищения", 7],
        ["Банки", 5],
        ["Проверка отчетов на повышение FA", 4],
      ],
      "CID": [
        ["Проведение допросов", 10],
        ["Сбор улик (за одну улику)", 5],
        ["Проверка отчетов на повышение CID", 4],
      ],
      "DEA": [
        ["Патрулирование острова (30 мин)", 7],
        ["Срез кустов (1 куст)", 2],
        ["Проверка отчетов на повышение DEA", 4],
      ],
      "FNA": [
        ["Выдача инвайтов (один человек)", 5],
        ["Подача государственных новостей (одна волна)", 4],
        ["Проведение экзаменов для TR (один экзамен)", 2],
        ["Проверка отчетов на повышение FNA", 4],
        ["Проведение тренировок для TR (одна тренировка)", 5],
        ["Проведение экзаменов для TR (один экзамен) — ранги 1–8", 4],
        ["Проверка отчетов на повышение TR", 3],
      ],
    };

    const STORAGE_KEY = "points-premii-v3";
    let state = {};
    let currentDept = Object.keys(DATA)[0];

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          state = JSON.parse(raw);
          setSave(true, "Данные загружены");
        } else setSave(true, "Автосохранение");
      } catch (e) { setSave(false, "Сохранение недоступно"); }
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        setSave(true, "Сохранено");
        return true;
      } catch (e) {
        setSave(false, "Ошибка");
        return false;
      }
    }

    function setSave(ok, text) {
      const el = document.getElementById("saveStatus");
      document.getElementById("saveText").textContent = text;
      el.classList.toggle("on", ok);
    }

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove("show"), 2200);
    }

    function getQty(dept, key) {
      return (state[dept] && state[dept][key]) || 0;
    }

    function setQty(dept, key, val) {
      if (!state[dept]) state[dept] = {};
      if (val === 0) {
        delete state[dept][key];
        if (Object.keys(state[dept]).length === 0) delete state[dept];
      } else state[dept][key] = val;
      save();
    }

    function calcTotal(dept) {
      let t = 0;
      OBSCHEE.forEach(([, p], i) => { t += p * getQty(dept, "o" + i); });
      (DATA[dept] || []).forEach(([, p], i) => { t += p * getQty(dept, "d" + i); });
      INOE.forEach(([, p], i) => { t += p * getQty(dept, "i" + i); });
      return t;
    }

    function renderNav() {
      const nav = document.getElementById("nav");
      let html = '<div class="nav-title">Отделы</div>';
      Object.keys(DATA).forEach(dept => {
        const total = calcTotal(dept);
        html += '<button class="nav-item' + (dept === currentDept ? ' active' : '') + '" data-dept="' + dept + '">' +
          dept + '<span class="badge' + (total > 0 ? ' on' : '') + '">' + total + '</span></button>';
      });
      nav.innerHTML = html;
      nav.querySelectorAll(".nav-item").forEach(btn => {
        btn.onclick = () => {
          currentDept = btn.dataset.dept;
          render();
          closeSidebar();
        };
      });
    }

    function rowHtml(name, pts, key, dept) {
      const q = getQty(dept, key);
      const s = pts * q;
      return (
        '<div class="row">' +
          '<div class="row-name">' + name + '</div>' +
          '<div class="pts">' + pts + '</div>' +
          '<div class="qty-wrap">' +
            '<button type="button" class="qty-btn" data-act="-" data-key="' + key + '" data-pts="' + pts + '">−</button>' +
            '<input type="number" class="qty-input" min="0" step="1" value="' + q + '" data-key="' + key + '" data-pts="' + pts + '" />' +
            '<button type="button" class="qty-btn" data-act="+" data-key="' + key + '" data-pts="' + pts + '">+</button>' +
          '</div>' +
          '<div class="sum' + (s > 0 ? ' on' : '') + '" data-sum="' + key + '">' + s + '</div>' +
        '</div>'
      );
    }

    function renderMain() {
      const main = document.getElementById("main");
      const dept = currentDept;
      const total = calcTotal(dept);

      let html = '';
      html += '<div class="page-header"><h2>' + dept + '</h2>';
      html += '<p>Введите количество — сумма считается сразу. Сохраняется автоматически.</p></div>';

      html += '<div class="actions">';
      html += '<button class="btn btn-primary" id="saveBtn" type="button">Сохранить</button>';
      html += '<button class="btn btn-danger" id="resetDeptBtn" type="button">Сбросить отдел</button>';
      html += '<button class="btn btn-ghost" id="resetAllBtn" type="button">Сбросить всё</button>';
      html += '</div>';

      html += '<div class="card"><div class="card-head obschee">Общее</div>';
      html += '<div class="cols"><div>Активность</div><div>Баллы</div><div>Кол-во</div><div>Сумма</div></div>';
      OBSCHEE.forEach((item, i) => { html += rowHtml(item[0], item[1], "o" + i, dept); });
      html += '</div>';

      html += '<div class="card"><div class="card-head dept">' + dept + '</div>';
      html += '<div class="cols"><div>Активность</div><div>Баллы</div><div>Кол-во</div><div>Сумма</div></div>';
      DATA[dept].forEach((item, i) => { html += rowHtml(item[0], item[1], "d" + i, dept); });
      html += '</div>';

      html += '<div class="card"><div class="card-head inoe">Иное</div>';
      html += '<div class="cols"><div>Активность</div><div>Баллы</div><div>Кол-во</div><div>Сумма</div></div>';
      INOE.forEach((item, i) => { html += rowHtml(item[0], item[1], "i" + i, dept); });
      html += '</div>';

      html += '<div class="total-bar"><div class="total-card">';
      html += '<div class="total-label">Итого по отделу</div>';
      html += '<div class="total-value" id="totalValue">' + total + '<span>баллов</span></div>';
      html += '</div></div>';

      main.innerHTML = html;

      function apply(key, pts, val) {
        setQty(dept, key, val);
        const sumEl = main.querySelector('[data-sum="' + key + '"]');
        const sum = pts * val;
        sumEl.textContent = sum;
        sumEl.classList.toggle("on", sum > 0);
        document.getElementById("totalValue").innerHTML = calcTotal(dept) + '<span>баллов</span>';
        renderNav();
      }

      main.querySelectorAll(".qty-input").forEach(inp => {
        inp.addEventListener("input", e => {
          let v = parseInt(e.target.value, 10);
          if (isNaN(v) || v < 0) v = 0;
          e.target.value = v;
          apply(e.target.dataset.key, parseInt(e.target.dataset.pts, 10), v);
        });
        inp.addEventListener("focus", e => e.target.select());
      });

      main.querySelectorAll(".qty-btn").forEach(btn => {
        btn.onclick = () => {
          const key = btn.dataset.key;
          const pts = parseInt(btn.dataset.pts, 10);
          const input = main.querySelector('.qty-input[data-key="' + key + '"]');
          let v = parseInt(input.value, 10) || 0;
          if (btn.dataset.act === "+") v++;
          else v = Math.max(0, v - 1);
          input.value = v;
          apply(key, pts, v);
        };
      });

      document.getElementById("saveBtn").onclick = () => {
        if (save()) toast("Сохранено");
      };
      document.getElementById("resetDeptBtn").onclick = () => {
        if (confirm("Сбросить отдел «" + dept + "»?")) {
          delete state[dept];
          save();
          render();
          toast("Отдел сброшен");
        }
      };
      document.getElementById("resetAllBtn").onclick = () => {
        if (confirm("Сбросить данные по всем отделам?")) {
          state = {};
          save();
          render();
          toast("Всё сброшено");
        }
      };
    }

    function render() {
      renderNav();
      renderMain();
    }

    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    function openSidebar() { sidebar.classList.add("open"); overlay.classList.add("open"); }
    function closeSidebar() { sidebar.classList.remove("open"); overlay.classList.remove("open"); }
    document.getElementById("menuToggle").onclick = openSidebar;
    overlay.onclick = closeSidebar;

    load();
    render();
  </script>
</body>
</html>
